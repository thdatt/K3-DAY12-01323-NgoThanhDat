# ============================================================
# railway.toml — Railway deployment configuration
#
# Docs: https://docs.railway.com/reference/config-as-code
# ============================================================

[build]
# Railway tự detect Dockerfile nếu có.
# Nếu không có Dockerfile, dùng Nixpacks (auto-detect Python).
builder = "NIXPACKS"

[deploy]
# ✅ Start command — Railway inject PORT tự động
# ✅ FIX: phải bọc trong `sh -c`, nếu không deploy sẽ chết ngay với lỗi:
#   Error: Invalid value for '--port': '$PORT' is not a valid integer.
#
# Railway chạy startCommand ở dạng exec (không qua shell), nên chuỗi "$PORT"
# được truyền NGUYÊN VĂN cho uvicorn thay vì thay bằng số cổng thật.
# Lỗi này đã gặp thật khi deploy 06-lab-complete lên Railway.
startCommand = "sh -c 'uvicorn app:app --host 0.0.0.0 --port $PORT'"

# Health check — Railway restart nếu fail
healthcheckPath = "/health"
healthcheckTimeout = 30

# Tự động restart khi crash
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ============================================================
# Environment variables đặt qua Railway Dashboard hoặc CLI:
#   railway variables set OPENAI_API_KEY=sk-...
#   railway variables set ENVIRONMENT=production
# ============================================================
