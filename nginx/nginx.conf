# ============================================================
# Nginx — Load balancer cho nhiều instance agent
# ============================================================

events {
    worker_connections 1024;
}

http {
    # Chỉ cần MỘT dòng `server agent:8000` là đủ cho mọi số lượng instance:
    # Docker Compose đăng ký tên `agent` trong DNS nội bộ trỏ tới tất cả IP
    # của các container agent, Nginx phân giải ra rồi tự xoay vòng
    # (round-robin). Chạy `--scale agent=5` không cần sửa file này.
    upstream agent_cluster {
        server agent:8000;
        keepalive 32;
    }

    # resolver của Docker + zone động: nếu không có, Nginx chỉ phân giải DNS
    # đúng MỘT lần lúc khởi động và sẽ không thấy các container được thêm vào
    # sau đó.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        server_tokens off;                  # ẩn phiên bản Nginx
        client_max_body_size 1m;

        # Cho biết instance nào đã phục vụ request — tiện quan sát load
        # balancer. Production thật nên tắt vì nó để lộ IP nội bộ.
        add_header X-Served-By $upstream_addr always;

        location / {
            proxy_pass http://agent_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Instance nào lỗi/timeout/503 (đang tắt dần) thì tự chuyển sang
            # instance khác — người dùng không thấy lỗi khi deploy bản mới.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;         # gọi LLM có thể lâu
        }

        location /health {
            proxy_pass http://agent_cluster/health;
            access_log off;                 # đỡ nhiễu log
        }

        location /ready {
            proxy_pass http://agent_cluster/ready;
            access_log off;
        }
    }
}
