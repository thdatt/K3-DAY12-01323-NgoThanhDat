# ============================================================
# CP5 — Cau hinh deploy Railway
# ============================================================

[build]
builder = "DOCKERFILE"

[deploy]
# Phai boc trong `sh -c`, neu khong deploy chet ngay voi loi:
#   Error: Invalid value for '--port': '$PORT' is not a valid integer.
# Railway chay startCommand o dang exec (khong qua shell), nen chuoi "$PORT"
# duoc truyen NGUYEN VAN cho uvicorn thay vi thay bang so cong that.
startCommand = "sh -c 'exec uvicorn app.main:app --host 0.0.0.0 --port $PORT'"

healthcheckPath = "/health"
healthcheckTimeout = 30

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ============================================================
# Bien moi truong dat qua CLI hoac Dashboard:
#   railway variables --set "AGENT_API_KEY=<chuoi-ngau-nhien>"
#   railway add --database redis     -> Railway tu tao REDIS_URL
#
# KHONG dat bien PORT - Railway tu inject. Dat tay se khien app nghe sai cong.
# ============================================================
