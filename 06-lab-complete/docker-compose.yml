# ============================================================
# Production Agent Stack
#
# Kiến trúc theo yêu cầu CODE_LAB.md Part 6 Step 8:
#     Client → Nginx (LB) → 3 x Agent → Redis
#
# Chạy:  docker compose up -d --build --scale agent=3
# Test:  curl http://localhost/health
# Dừng:  docker compose down
#
# Lưu ý: service `agent` KHÔNG publish port ra host — nếu publish thì
# `--scale agent=3` sẽ lỗi vì 3 container tranh nhau cùng một port. Mọi
# traffic đi qua Nginx, đây cũng là mô hình bảo mật chuẩn.
# ============================================================

services:

  # ──────────────────────────────────────
  # Agent — scale được nhiều instance
  # ──────────────────────────────────────
  agent:
    build: .
    environment:
      - ENVIRONMENT=staging
      - APP_NAME=Production AI Agent
      - REDIS_URL=redis://redis:6379/0
      - PORT=8000
    env_file:
      - .env.local
    depends_on:
      redis:
        condition: service_healthy    # chờ Redis SẴN SÀNG, không chỉ "đã tạo"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - agent_net

  # ──────────────────────────────────────
  # Redis — nơi giữ state dùng chung
  # ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data          # giữ dữ liệu qua các lần restart
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - agent_net

  # ──────────────────────────────────────
  # Nginx — load balancer, cổng duy nhất ra ngoài
  # ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent
    restart: unless-stopped
    networks:
      - agent_net

volumes:
  redis_data:

networks:
  agent_net:
    driver: bridge
