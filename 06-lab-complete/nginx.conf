# ============================================================
# Nginx — Reverse Proxy & Load Balancer
# ============================================================

events {
    worker_connections 1024;
}

http {
    # ──────────────────────────────────────
    # Upstream
    #
    # Chỉ khai báo MỘT dòng `server agent:8000` là đủ cho mọi số lượng
    # instance: Docker Compose đăng ký tên `agent` trong DNS nội bộ trỏ tới
    # tất cả IP của các container agent, Nginx phân giải ra rồi tự xoay vòng
    # (round-robin). Chạy `--scale agent=5` không cần sửa file này.
    # ──────────────────────────────────────
    upstream agent_backend {
        server agent:8000;
        keepalive 32;
    }

    # Rate limit tầng ngoài (theo IP) — bổ sung cho rate limit trong app
    # (theo API key). Tầng này chặn kẻ tấn công còn chưa có key hợp lệ,
    # đỡ tốn tài nguyên cho app phía sau.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    server {
        listen 80;
        server_name _;

        # ── Security headers ──
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        server_tokens off;                 # ẩn phiên bản Nginx

        client_max_body_size 1m;           # chặn payload khổng lồ

        # Cho biết instance nào đã phục vụ request — rất tiện để quan sát
        # load balancer hoạt động. Trên production thật nên TẮT, vì nó để lộ
        # địa chỉ IP nội bộ ra ngoài.
        add_header X-Served-By $upstream_addr always;

        location / {
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://agent_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Instance nào lỗi/timeout/503 thì tự chuyển sang instance khác
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 3;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;        # gọi LLM có thể lâu
        }

        # Health check không rate limit, không ghi log cho đỡ nhiễu
        location /health {
            proxy_pass http://agent_backend/health;
            access_log off;
        }

        location /ready {
            proxy_pass http://agent_backend/ready;
            access_log off;
        }

        error_page 429 /rate_limited.json;
        location = /rate_limited.json {
            return 429 '{"error":"Too many requests","retry_after":1}';
            add_header Content-Type application/json;
        }
    }
}
